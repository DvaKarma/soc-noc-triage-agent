# Test-only Postgres + pgvector for the kind end-to-end job. Use a managed database in production.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgvector
spec:
  replicas: 1
  selector:
    matchLabels: {app: pgvector}
  template:
    metadata:
      labels: {app: pgvector}
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          env:
            - {name: POSTGRES_USER, value: triage}
            - {name: POSTGRES_PASSWORD, value: triage}
            - {name: POSTGRES_DB, value: triage}
          ports:
            - containerPort: 5432
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "triage"]}
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: pgvector
spec:
  selector: {app: pgvector}
  ports:
    - port: 5432
