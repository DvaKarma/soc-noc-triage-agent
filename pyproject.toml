[project]
name = "soc-noc-triage-agent"
version = "0.1.0"
description = "LLM agent that triages SOC/NOC alerts (Zabbix, Wazuh) with RAG over runbooks and human approval for sensitive actions."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Vinicius Dutra" }]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "httpx>=0.27",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8", "ruff>=0.6", "psycopg[binary]>=3.2"]

[project.scripts]
triage-ingest = "triage.cli:ingest"
triage-evals = "triage.evals:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triage"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
